<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Drawmbient</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark:#14120f;
    --bg-dark-2:#1c1a16;
    --paper:#f1ead9;
    --paper-shadow:#00000030;
    --ink:#ede6da;
    --ink-dim:#a79c8a;
    --accent:#b4744f;
    --accent-2:#c9a227;
    --line:#2c281f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg-dark);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #app{height:100%;position:relative;}
  .screen{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
  }
  .screen.active{display:flex;}
  /* ---------- shared ---------- */
  h1.brand{
    font-family:"Fraunces",serif;
    font-weight:500;
    font-size:clamp(24px,6vw,34px);
    margin:0;
    letter-spacing:0.01em;
  }
  .tagline{
    margin:6px 0 0;
    font-size:13px;
    color:var(--ink-dim);
    max-width:340px;
  }
  .primary-btn{
    font-family:"Fraunces",serif;
    font-size:16px;
    font-weight:500;
    background:var(--accent);
    color:#14120f;
    border:none;
    padding:12px 28px;
    border-radius:100px;
    cursor:pointer;
  }
  .primary-btn:active{transform:scale(0.97);}
  .primary-btn[disabled]{opacity:0.35;pointer-events:none;}
  .credit-line{
    font-size:11.5px;
    color:var(--ink-dim);
    letter-spacing:0.02em;
    opacity:0.75;
    margin:0;
  }
  .credit-link{
    color:var(--ink-dim);
    text-decoration:none;
    border-bottom:1px solid currentColor;
  }
  .credit-line:hover{opacity:1;}
  .credit-link:hover{color:var(--ink);}
  .ghost-btn{
    font-size:13px;
    color:var(--ink-dim);
    background:transparent;
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:100px;
    cursor:pointer;
  }
  .ghost-btn:hover{color:var(--ink);border-color:var(--ink-dim);}
  /* ---------- screen: start ---------- */
  #screen-start{
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:22px;
    padding:24px;
  }
  /* ---------- screen: palette select ---------- */
  #screen-palette{
    align-items:center;
    padding:20px 16px 0;
  }
  #screen-palette .head{
    text-align:center;
    flex:0 0 auto;
    margin-bottom:10px;
  }
  #screen-palette .head p{
    font-size:12.5px;
    color:var(--ink-dim);
    margin:4px 0 0;
  }
  #palette-list{
    flex:1 1 auto;
    width:100%;
    max-width:920px;
    overflow-y:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:14px;
    padding:10px 4px 130px;
  }
  .palette-card{
    background:var(--bg-dark-2);
    border:2px solid var(--line);
    border-radius:16px;
    padding:16px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    cursor:pointer;
  }
  .palette-card.selected{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(180,116,79,0.25);
  }
  .swatch-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
  }
  .swatch-grid .dot{
    width:11px;
    height:11px;
    border-radius:50%;
  }
  .palette-name{
    font-family:"Fraunces",serif;
    font-size:15px;
  }
  .palette-note{
    font-size:10.5px;
    color:var(--ink-dim);
    margin-top:-6px;
  }

  #confirm-bar{
    position:absolute;
    left:0; right:0; bottom:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:16px;
    background:linear-gradient(to top, var(--bg-dark) 60%, transparent);
  }

  /* ---------- screen: canvas ---------- */
  #screen-canvas{height:100%;}
  #canvas-topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
  }
  #canvas-topbar .palette-label{
    font-size:12px;
    color:var(--ink-dim);
  }
  #canvas-wrap{
    flex:1 1 auto;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6px 16px;
    min-height:0;
  }
  #canvas-frame{
    position:relative;
    width:100%;
    height:100%;
    max-width:1000px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 20px 50px var(--paper-shadow), inset 0 0 0 1px #00000015;
    overflow:hidden;
  }
  #draw-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
    cursor:none;
  }
  #cursor-dot{
    position:absolute;
    pointer-events:none;
    border-radius:50%;
    border:1.5px solid var(--accent);
    transform:translate(-50%,-50%);
    opacity:0;
    transition:opacity .15s ease;
    z-index:5;
  }
  footer{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    padding:12px 16px 16px;
    background:var(--bg-dark-2);
    border-top:1px solid var(--line);
    position:relative;
  }
  .control-group{display:flex;align-items:center;gap:8px;}
  .tool-btn{
    width:36px;height:36px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--ink-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .tool-btn.active{border-color:var(--accent);color:var(--accent);}
  .tool-btn svg{width:16px;height:16px;}
  #size-range{width:90px;accent-color:var(--accent);}
  #current-color-btn{
    width:30px;height:30px;
    border-radius:50%;
    border:2px solid var(--ink);
    cursor:pointer;
    padding:0;
  }
  #color-popover{
    position:absolute;
    bottom:calc(100% + 12px);
    left:50%;
    transform:translateX(-50%);
    background:var(--bg-dark);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    display:none;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
    box-shadow:0 10px 30px #00000060;
    z-index:20;
  }
  #color-popover.open{display:grid;}
  #color-popover .dot{
    width:18px;height:18px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
  }
  #color-popover .dot.active{border-color:var(--ink);}
  #clear-btn{
    font-size:12.5px;
    color:var(--ink-dim);
    background:transparent;
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:100px;
    cursor:pointer;
  }
  #clear-btn:hover{color:var(--ink);border-color:var(--ink-dim);}
  @media (max-width:520px){
    footer{gap:12px;padding:10px 10px 14px;}
    #size-range{width:64px;}
  }
</style>
</head>
<body>
<div id="app">
  <!-- ============ SCREEN 1: START ============ -->
  <div class="screen active" id="screen-start">
    <h1 class="brand">Drawmbient</h1>
    <p class="tagline">Paint with colour, listen to what grows. Choose a palette, draw, and the picture composes its own ambient music.</p>
    <button class="primary-btn" id="start-draw-btn">Start Draw</button>
    <p class="credit-line">by <a href="https://beacons.ai/mimosadimension" target="_blank" rel="noopener" class="credit-link">Mimosa Dimension</a></p>
  </div>
  <!-- ============ SCREEN 2: PALETTE SELECT ============ -->
  <div class="screen" id="screen-palette">
    <div class="head">
      <h1 class="brand" style="font-size:20px;">Choose a palette</h1>
      <p>Each palette has its own 21 colours and its own set of tracks</p>
    </div>
    <div id="palette-list"></div>
    <div id="confirm-bar">
      <button class="ghost-btn" id="palette-back-btn">Back</button>
      <button class="primary-btn" id="confirm-btn" disabled>Confirm</button>
    </div>
  </div>
  <!-- ============ SCREEN 3: CANVAS ============ -->
  <div class="screen" id="screen-canvas">
    <div id="canvas-topbar">
      <button class="ghost-btn" id="canvas-back-btn">← Palettes</button>
      <span class="palette-label" id="canvas-palette-label"></span>
    </div>
    <div id="canvas-wrap">
      <div id="canvas-frame">
        <canvas id="draw-canvas"></canvas>
        <div id="cursor-dot"></div>
      </div>
    </div>
    <footer>
      <div class="control-group" id="tool-group">
        <button class="tool-btn active" data-tool="brush" title="Brush">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l3-1 9-9-2-2-9 9-1 3z"/><path d="M14 8l2-2 2 2-2 2"/></svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="Eraser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 15l8-8 5 5-8 8H9l-3-3z"/><path d="M9 20H4"/></svg>
        </button>
      </div>

      <div class="control-group">
        <label for="size-range" style="font-size:12px;color:var(--ink-dim);">Size</label>
        <input type="range" id="size-range" min="4" max="70" value="26">
      </div>

      <div class="control-group" style="position:relative;">
        <button id="current-color-btn"></button>
        <div id="color-popover"></div>
      </div>

      <button id="clear-btn">Clear canvas</button>
    </footer>
  </div>

</div>

<script>
/* ===========================================================
   PALETTES
   Каждая палитра = 21 цвет (7 в ряд, 3 ряда).
   file: путь к аудио-лупу. Если file = null — цвет пока
   беззвучный (заглушка), просто для проверки интерфейса.
=========================================================== */
// вспомогательная функция: HSL -> HEX
function hsl(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
// генерирует 21 цвет: 7 оттенков в диапазоне [hueStart..hueEnd] x 3 яркости
function buildHueSweep(hueStart, hueEnd, sat){
  const lightness = [70, 52, 34]; // светлый / средний / тёмный ряд
  const colors = [];
  lightness.forEach(l => {
    for (let i = 0; i < 7; i++) {
      const h = hueStart + (hueEnd - hueStart) * (i / 6);
      colors.push(hsl(h, sat, l));
    }
  });
  return colors;
}
// наши 4 реальных, уже озвученных цвета
const REAL_COLORS = [
  { color: '#3a6b63', file: 'audio/color1.mp3', maxVolume: 0.7 },
  { color: '#b4744f', file: 'audio/color2.mp3', maxVolume: 0.7 },
  { color: '#8a6bae', file: 'audio/color3.mp3', maxVolume: 0.7 },
  { color: '#c9a227', file: 'audio/color4.mp3', maxVolume: 0.7 }
];
// нейтральные заглушки для оставшихся 17 слотов палитры "Origins"
const NEUTRAL_FILLERS = buildHueSweep(40, 40, 7).slice(0, 17)
  .map(hex => ({ color: hex, file: null, maxVolume: 0.7 }));
const PALETTES = [
  {
    id: 'origins',
    name: 'Origins',
    note: 'live sound — 4 colours',
    colors: [...REAL_COLORS, ...NEUTRAL_FILLERS]
  },
  {
    id: 'glacier',
    name: 'Glacier',
    note: 'preview — no sound yet',
    colors: buildHueSweep(185, 230, 45).map(hex => ({ color: hex, file: null, maxVolume: 0.7 }))
  },
  {
    id: 'moss',
    name: 'Moss',
    note: 'preview — no sound yet',
    colors: buildHueSweep(70, 140, 40).map(hex => ({ color: hex, file: null, maxVolume: 0.7 }))
  }
];
let selectedPalette = null;   // палитра, выбранная (но ещё не подтверждённая)
let ACTIVE_TRACKS = [];       // цвета+треки активной палитры на холсте
/* ===========================================================
   SCREEN SWITCHING
=========================================================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
document.getElementById('start-draw-btn').addEventListener('click', () => {
  showScreen('screen-palette');
});
document.getElementById('palette-back-btn').addEventListener('click', () => {
  showScreen('screen-start');
});
/* ===========================================================
   RENDER PALETTE CARDS
=========================================================== */
const paletteList = document.getElementById('palette-list');
PALETTES.forEach(p => {
  const card = document.createElement('div');
  card.className = 'palette-card';
  card.dataset.id = p.id;
  const grid = document.createElement('div');
  grid.className = 'swatch-grid';
  p.colors.forEach(c => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.background = c.color;
    grid.appendChild(dot);
  });
  const name = document.createElement('div');
  name.className = 'palette-name';
  name.textContent = p.name;
  const note = document.createElement('div');
  note.className = 'palette-note';
  note.textContent = p.note;
  card.appendChild(grid);
  card.appendChild(name);
  card.appendChild(note);
  paletteList.appendChild(card);
  card.addEventListener('click', () => {
    selectedPalette = p;
    document.querySelectorAll('.palette-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    document.getElementById('confirm-btn').disabled = false;
  });
});
document.getElementById('confirm-btn').addEventListener('click', () => {
  if (!selectedPalette) return;
  enterCanvasScreen(selectedPalette);
});
/* ===========================================================
   CANVAS SETUP
=========================================================== */
const frame = document.getElementById('canvas-frame');
const canvas = document.getElementById('draw-canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const cursorDot = document.getElementById('cursor-dot');
let dpr = Math.max(1, window.devicePixelRatio || 1);
function resizeCanvas(){
  const rect = frame.getBoundingClientRect();
  const oldW = canvas.width, oldH = canvas.height;
  let snapshot = null;
  if (oldW > 0 && oldH > 0) {
    snapshot = document.createElement('canvas');
    snapshot.width = oldW;
    snapshot.height = oldH;
    snapshot.getContext('2d').drawImage(canvas, 0, 0);
  }
  dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (snapshot) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(snapshot, 0, 0, oldW, oldH, 0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.restore();
  }
}

window.addEventListener('resize', () => { if (document.getElementById('screen-canvas').classList.contains('active')) resizeCanvas(); });
window.addEventListener('orientationchange', () => setTimeout(() => { if (document.getElementById('screen-canvas').classList.contains('active')) resizeCanvas(); }, 200));

/* ===========================================================
   DRAWING
=========================================================== */
let currentTool = 'brush';
let currentColor = '#000000';
let brushSize = parseInt(document.getElementById('size-range').value, 10);
let drawing = false;
let lastX = 0, lastY = 0;

function setTool(tool){
  currentTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
}
document.getElementById('tool-group').addEventListener('click', (e) => {
  const btn = e.target.closest('.tool-btn');
  if (!btn) return;
  setTool(btn.dataset.tool);
});
document.getElementById('size-range').addEventListener('input', (e) => {
  brushSize = parseInt(e.target.value, 10);
  updateCursorSize();
});
function updateCursorSize(){
  cursorDot.style.width = brushSize + 'px';
  cursorDot.style.height = brushSize + 'px';
}
updateCursorSize();
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function strokeAt(x, y, lx, ly){
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = brushSize;
  if (currentTool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = currentColor;
  }
  ctx.beginPath();
  ctx.moveTo(lx, ly);
  ctx.lineTo(x, y);
  ctx.stroke();
}
canvas.addEventListener('pointerdown', (e) => {
  drawing = true;
  const p = getPos(e);
  lastX = p.x; lastY = p.y;
  strokeAt(p.x, p.y, p.x - 0.1, p.y - 0.1);
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  const p = getPos(e);
  cursorDot.style.left = p.x + 'px';
  cursorDot.style.top = p.y + 'px';
  cursorDot.style.opacity = 1;
  cursorDot.style.borderColor = currentTool === 'eraser' ? 'var(--ink-dim)' : currentColor;
  if (!drawing) return;
  strokeAt(p.x, p.y, lastX, lastY);
  lastX = p.x; lastY = p.y;
});
canvas.addEventListener('pointerup', () => drawing = false);
canvas.addEventListener('pointerleave', () => { drawing = false; cursorDot.style.opacity = 0; });
canvas.addEventListener('pointercancel', () => drawing = false);
document.getElementById('clear-btn').addEventListener('click', () => {
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
});
/* ===========================================================
   BRUSH COLOR POPOVER (21 цвет активной палитры)
=========================================================== */
const currentColorBtn = document.getElementById('current-color-btn');
const colorPopover = document.getElementById('color-popover');
currentColorBtn.addEventListener('click', () => {
  colorPopover.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('#current-color-btn') && !e.target.closest('#color-popover')) {
    colorPopover.classList.remove('open');
  }
});
function buildColorPopover(){
  colorPopover.innerHTML = '';
  ACTIVE_TRACKS.forEach((t, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.background = t.color;
    if (t.color === currentColor) dot.classList.add('active');
    dot.addEventListener('click', () => {
      currentColor = t.color;
      setTool('brush');
      currentColorBtn.style.background = currentColor;
      colorPopover.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
      dot.classList.add('active');
      colorPopover.classList.remove('open');
    });
    colorPopover.appendChild(dot);
  });
}
/* ===========================================================
   COLOR ANALYSIS
=========================================================== */
const analysisSize = 80;
const analysisCanvas = document.createElement('canvas');
analysisCanvas.width = analysisSize;
analysisCanvas.height = analysisSize;
const actx = analysisCanvas.getContext('2d', { willReadFrequently: true });
function hexToRgb(hexStr){
  const n = parseInt(hexStr.replace('#',''), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function nearestTrackIndex(r, g, b){
  let bestIdx = -1, bestDist = Infinity;
  for (let i = 0; i < ACTIVE_TRACKS.length; i++) {
    const c = ACTIVE_TRACKS[i].rgb;
    const d = (r - c.r) ** 2 + (g - c.g) ** 2 + (b - c.b) ** 2;
    if (d < bestDist) { bestDist = d; bestIdx = i; }
  }
  return bestDist < 60 * 60 ? bestIdx : -1;
}
function analyzeCanvas(){
  actx.clearRect(0, 0, analysisSize, analysisSize);
  actx.drawImage(canvas, 0, 0, analysisSize, analysisSize);
  const data = actx.getImageData(0, 0, analysisSize, analysisSize).data;
  const counts = new Array(ACTIVE_TRACKS.length).fill(0);
  const xWeightSum = new Array(ACTIVE_TRACKS.length).fill(0);
  let totalPixels = 0;
  for (let py = 0; py < analysisSize; py++) {
    for (let px = 0; px < analysisSize; px++) {
      const idx = (py * analysisSize + px) * 4;
      const alpha = data[idx + 3];
      totalPixels++;
      if (alpha < 40) continue;

      const trackIdx = nearestTrackIndex(data[idx], data[idx+1], data[idx+2]);
      if (trackIdx === -1) continue;

      counts[trackIdx]++;
      const normX = (px / (analysisSize - 1)) * 2 - 1;
      xWeightSum[trackIdx] += normX;
    }
  }

  return ACTIVE_TRACKS.map((t, i) => {
    const percent = counts[i] / totalPixels;
    const pan = counts[i] > 0 ? xWeightSum[i] / counts[i] : 0;
    return { percent, pan };
  });
}

/* ===========================================================
   AUDIO ENGINE
=========================================================== */
const VOLUME_FULL_AT_PERCENT = 0.22;
const SMOOTHING_TIME = 0.35;
let audioCtx = null;
let audioState = [];
async function loadBuffer(url){
  const res = await fetch(url);
  const arr = await res.arrayBuffer();
  return audioCtx.decodeAudioData(arr);
}
async function ensureAudioReady(){
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }
  await Promise.all(ACTIVE_TRACKS.map(async (t, i) => {
    if (!t.file) return; // цвет-заглушка без звука
    if (t.buffer) return; // уже загружен ранее (кэш)
    try {
      t.buffer = await loadBuffer(t.file);
    } catch (err) {
      console.warn('Could not load track for', t.color, t.file, err);
    }
  }));
}
function startTrack(i){
  const state = audioState[i];
  const track = ACTIVE_TRACKS[i];
  if (!track.buffer || state.playing) return;
  const source = audioCtx.createBufferSource();
  source.buffer = track.buffer;
  source.loop = true;
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = 0.0001;
  const pannerNode = audioCtx.createStereoPanner();
  pannerNode.pan.value = 0;
  source.connect(gainNode);
  gainNode.connect(pannerNode);
  pannerNode.connect(audioCtx.destination);
  source.start();
  state.source = source;
  state.gainNode = gainNode;
  state.pannerNode = pannerNode;
  state.playing = true;
}
function stopTrack(i){
  const state = audioState[i];
  if (!state.playing) return;
  const now = audioCtx.currentTime;
  state.gainNode.gain.cancelScheduledValues(now);
  state.gainNode.gain.setTargetAtTime(0.0001, now, 0.08);
  const sourceToStop = state.source;
  setTimeout(() => { try { sourceToStop.stop(); } catch(e) {} }, 250);
  state.playing = false;
  state.source = null;
  state.gainNode = null;
  state.pannerNode = null;
}
function stopAllTracks(){
  audioState.forEach((s, i) => { if (s.playing) stopTrack(i); });
}
function updateAudioFromAnalysis(analysis){
  analysis.forEach((a, i) => {
    const track = ACTIVE_TRACKS[i];
    const state = audioState[i];
    if (!track.file) return; // заглушка — звука нет и не будет
    if (a.percent <= 0.0005) {
      if (state.playing) stopTrack(i);
      return;
    }
    if (!state.playing) startTrack(i);
    if (!state.playing) return;
    const targetVolume = track.maxVolume * Math.min(a.percent / VOLUME_FULL_AT_PERCENT, 1);
    const now = audioCtx.currentTime;
    state.gainNode.gain.setTargetAtTime(Math.max(targetVolume, 0.0001), now, SMOOTHING_TIME);
    state.pannerNode.pan.setTargetAtTime(a.pan, now, SMOOTHING_TIME);
  });
}
let analysisTimer = null;
function startAnalysisLoop(){
  stopAnalysisLoop();
  analysisTimer = setInterval(() => {
    const analysis = analyzeCanvas();
    updateAudioFromAnalysis(analysis);
  }, 120);
}
function stopAnalysisLoop(){
  if (analysisTimer) { clearInterval(analysisTimer); analysisTimer = null; }
}
/* ===========================================================
   ENTER / LEAVE CANVAS SCREEN
=========================================================== */
async function enterCanvasScreen(palette){
  ACTIVE_TRACKS = palette.colors.map(c => ({ ...c, rgb: hexToRgb(c.color) }));
  audioState = ACTIVE_TRACKS.map(() => ({ source: null, gainNode: null, pannerNode: null, playing: false }));

  currentColor = ACTIVE_TRACKS[0].color;
  setTool('brush');
  currentColorBtn.style.background = currentColor;

  document.getElementById('canvas-palette-label').textContent = palette.name;

  showScreen('screen-canvas');
  resizeCanvas();
  buildColorPopover();

  // клик по Confirm — уже пользовательский жест, можно сразу инициализировать звук
  await ensureAudioReady();
  startAnalysisLoop();
}

document.getElementById('canvas-back-btn').addEventListener('click', () => {
  stopAllTracks();
  stopAnalysisLoop();
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
  colorPopover.classList.remove('open');
  showScreen('screen-palette');
});
</script>
